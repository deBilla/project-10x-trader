# Crypto strategy: dual (mean-reversion + breakout), faster 2-min loop (24/7).
# bracket.stop_loss_pct / take_profit_pct drive the deterministic SOFTWARE stop
# (Alpaca crypto has no native bracket), not an order leg.
tick_interval_minutes: 2
enforce_trend_filter: true

indicators:
  rsi_period: 14
  bbands_period: 20
  bbands_std: 2.0
  ema_fast: 9
  ema_slow: 21
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  volume_avg_period: 20

thresholds:
  rsi_oversold: 30
  rsi_overbought: 70
  volume_surge_mult: 1.2

bracket:
  stop_loss_pct: 0.03      # crypto is more volatile — wider software stop
  take_profit_pct: 0.06

breakout:
  enabled: true
  channel_period: 20
  min_rsi_long: 50
  max_rsi_long: 75
  min_rsi_short: 25
  max_rsi_short: 50
