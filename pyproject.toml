[project]
name = "project-10x-trader"
version = "0.1.0"
description = "Autonomous LLM-driven Alpaca paper-trading agent (Phase 1 MVP)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "alpaca-py>=0.33.0",
    "pandas>=2.2.0",
    "numpy>=1.26",
    "pymongo>=4.8.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mongomock>=4.1.0",
    "fakeredis>=2.23.0",
]

[project.scripts]
trader = "trader.main:main"
trader-backtest = "trader.backtest.run:main"
trader-eval = "trader.eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
